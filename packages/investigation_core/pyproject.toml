[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investigation-core"
version = "0.1.0"
description = "Headless investigation engine for 诡秘之主"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]
ignore = ["UP042", "E501", "C416", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests_inv/*" = ["T20", "ARG"]
"src/investigation_core/cli_demo.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests_inv"]

[tool.coverage.run]
omit = ["*/cli_demo.py", "*/__main__.py"]
