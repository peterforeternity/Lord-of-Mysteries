name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  VITE_API_BASE_URL: "http://127.0.0.1:8000"
  # PYTHONPATH must NOT be set — workspace resolution handles imports

jobs:
  # ================================================================
  # Python — lint, type-check, test, playthrough
  # ================================================================
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Black
        run: uv run black --check .

      - name: Type check with mypy
        run: uv run mypy .

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Validate content (case_clockmaker_01)
        run: uv run python tools/validate_content.py content/cases/case_clockmaker_01

      - name: Check clue reachability (case_clockmaker_01)
        run: uv run python tools/check_clue_reachability.py content/cases/case_clockmaker_01

      - name: Enumerate endings (case_clockmaker_01)
        run: uv run python tools/enumerate_endings.py content/cases/case_clockmaker_01

      - name: Simulate NPC removal (case_clockmaker_01)
        run: uv run python tools/simulate_npc_removal.py content/cases/case_clockmaker_01

      - name: Run full playthrough
        run: uv run python tools/run_playthrough.py --all

  # ================================================================
  # Frontend — lint, type-check, unit-test, build
  # ================================================================
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # ================================================================
  # E2E — Playwright browser tests with Game API + Vite
  # ================================================================
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Start Game API
        run: |
          cd ${{ github.workspace }}
          uv run uvicorn game_api.main:app --host 127.0.0.1 --port 8000 &
          echo "GAME_API_PID=$!"
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/v1/health > /dev/null 2>&1; then
              echo "Game API ready"
              break
            fi
            sleep 1
          done

      - name: Start Vite
        run: |
          VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }} npx vite --host 127.0.0.1 --port 5173 &
          echo "VITE_PID=$!"
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5173/ 2>/dev/null | grep -q 200; then
              echo "Vite ready"
              break
            fi
            sleep 1
          done

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 3

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: apps/web/playwright-report/
          retention-days: 3
